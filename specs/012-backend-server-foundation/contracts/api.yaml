openapi: 3.0.0
info:
  title: Physical AI API - Server Foundation
  version: 1.0.0
  description: Basic endpoints for verifying the deployment of the FastAPI backend.

servers:
  - url: /api
    description: Base path for the FastAPI application

paths:
  /:
    get:
      summary: API Status Check
      operationId: getApiStatus
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Physical AI API Ready

  /health:
    get:
      summary: Health Check
      operationId: getHealth
      responses:
        '200':
          description: Application is healthy
